version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - corepack enable
            - corepack prepare pnpm@9.12.0 --activate
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter @notdrive/web build
      artifacts:
        baseDirectory: apps/web/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/web/node_modules/**/*
      buildPath: /
    appRoot: apps/web

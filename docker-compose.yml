services:
  postgres:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: notdrive
      POSTGRES_PASSWORD: notdrive
      POSTGRES_DB: notdrive
    ports:
      - '5432:5432'
    volumes:
      - pgdata18:/var/lib/postgresql
    profiles: ['pg']

  mailhog:
    # Post-v1.30 security fixes, pinned to the scanned multi-platform edge snapshot.
    image: axllent/mailpit@sha256:bccf2e68cfe67695cd6ed4d73e9def6100ea48a262901b1945befbed91cceec7
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata18:
